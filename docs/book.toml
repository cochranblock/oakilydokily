[book]
title = "oakilydokily"
description = "Waiver management system with ESIGN support. First paid CochranBlock partnership."
authors = ["Michael Cochran"]
language = "en"
src = "src"

[output.html]
git-repository-url = "https://github.com/cochranblock/oakilydokily"
edit-url-template = "https://github.com/cochranblock/oakilydokily/edit/main/docs/src/{path}"
site-url = "/oakilydokily/"
additional-css = ["theme/custom.css"]
additional-js = ["theme/force-theme.js"]
default-theme = "coal"
preferred-dark-theme = "coal"
no-section-label = true

[output.html.fold]
enable = true
level = 1
